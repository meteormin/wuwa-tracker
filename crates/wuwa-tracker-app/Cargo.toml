[package]
name = "wuwa-tracker"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "wuwa-tracker"

[features]
default = ["gui"]
gui = ["dep:tauri", "dep:tauri-build"]

[build-dependencies]
tauri-build = { workspace = true, optional = true }

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { workspace = true, optional = true }
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
unicode-width.workspace = true
wuwa-tracker-core = { path = "../wuwa-tracker-core" }
wuwa-tracker-types = { path = "../wuwa-tracker-types" }

[[bin]]
name = "wuwa-tracker"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "wuwa-tracker-cli"
path = "src/cli_main.rs"
